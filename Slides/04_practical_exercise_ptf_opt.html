# Class Example: Portfolio Optimization with `IntroCompFinR`

## Given setup for two assets A and B {-}


```{=latex} 
\begin{table}[htbp]
\centering
\begin{tabular}{lcc}
\hline
 &amp; Asset A &amp; Asset B \\
\hline
$\mu$    &amp; 0.175 &amp; 0.055 \\
$\sigma$ &amp; 0.258 &amp; 0.115 \\
$\rho(\text{Asset A},\text{Asset B})$ &amp; \multicolumn{2}{c}{$-0.164$} \\
\hline
\end{tabular}
\end{table}
```

where `\(\mu\)` is the expected return, `\(\sigma\)` is the volatility (standard
deviation) of returns, and `\(\rho\)` is the correlation coefficient between
assets A and B.

Risk free rate `\(r_f = 0.005\)`.


``` r
# initialize parameters
mu.A = 0.175
sig.A = 0.258
sig2.A = sig.A^2

mu.B = 0.055
sig.B = 0.115
sig2.B = sig.B^2

rho.AB = -0.164
sig.AB = rho.AB*sig.A*sig.B

rf &lt;- .005 # risk-free rate

# IntroCompFinR takes the expected returns as a named vector and the
# covariances as a named matrix
mu.vec &lt;- c(mu.A, mu.B)
names(mu.vec) &lt;- c("Asset A", "Asset B")

sigma.vec &lt;- c(sig.A, sig.B)
names(sigma.vec) &lt;- c("Asset A", "Asset B")

sigma2.mat &lt;- matrix(c(sig2.A, sig.AB, sig.AB, sig2.B), ncol=2)
colnames(sigma2.mat) &lt;- rownames(sigma2.mat) &lt;- c("Asset A", "Asset B")
```

## Equally weighted portfolio

To create an equally weighted portfolio:


``` r
k &lt;- 2 # number of assets
ew &lt;- rep(1,k)/k
equalWeight.portfolio &lt;- getPortfolio(er=mu.vec, cov.mat=sigma2.mat, weights=ew)
equalWeight.portfolio
```

```
## Call:
## getPortfolio(er = mu.vec, cov.mat = sigma2.mat, weights = ew)
## 
## Portfolio expected return:     0.115 
## Portfolio standard deviation:  0.1323416 
## Portfolio weights:
## Asset A Asset B 
##     0.5     0.5
```

You can create any custom portfolio using the `getPortfolio()` function by
specifying the weights, expected return, and covariance matrix of individual
assets.

## Global minimum variance portfolio

The global minimum variance portfolio (allowing for short sales) is computed
using:


``` r
gmv.port &lt;- globalMin.portfolio(mu.vec, sigma2.mat)
gmv.port
```

```
## Call:
## globalMin.portfolio(er = mu.vec, cov.mat = sigma2.mat)
## 
## Portfolio expected return:     0.0792503 
## Portfolio standard deviation:  0.09782172 
## Portfolio weights:
## Asset A Asset B 
##  0.2021  0.7979
```

- If short sales are not allowed, then set `shorts = FALSE`.

## Efficient portfolio with target return

You can compute the portfolio with a target expected return with
`efficient.portfolio()`.


``` r
target.return &lt;- mu.vec[1]
e.port.target &lt;- efficient.portfolio(mu.vec, sigma2.mat, target.return)
e.port.target
```

```
## Call:
## efficient.portfolio(er = mu.vec, cov.mat = sigma2.mat, target.return = target.return)
## 
## Portfolio expected return:     0.175 
## Portfolio standard deviation:  0.258 
## Portfolio weights:
## Asset A Asset B 
##       1       0
```

- Note that when the target return is set to the expected return of one of the
  assets (Asset A here), the efficient portfolio is simply that asset.

## Tangency portfolio

The tangency portfolio can be computed using `tangency.portfolio()`:


``` r
tan.port &lt;- tangency.portfolio(mu.vec, sigma2.mat, risk.free = rf)
tan.port
```

```
## Call:
## tangency.portfolio(er = mu.vec, cov.mat = sigma2.mat, risk.free = rf)
## 
## Portfolio expected return:     0.09998087 
## Portfolio standard deviation:  0.110638 
## Portfolio weights:
## Asset A Asset B 
##  0.3748  0.6252
```


``` r
cat("Sharpe ratio of Tangency portfolio:\n")
((tan.port$er - rf) / tan.port$sd) %&gt;% round(4)
```

```
## Sharpe ratio of Tangency portfolio:
## [1] 0.8585
```

Compare with the Sharpe ratios of the individual assets:


``` r
round((mu.vec - rf)/sigma.vec, 4)
```

```
## Asset A Asset B 
##  0.6589  0.4348
```

## Efficient frontier

The function `efficient.frontier()` constructs the set of efficient portfolios.


``` r
ef &lt;- efficient.frontier(mu.vec, sigma2.mat, alpha.min=-0.5, alpha.max=2, nport=20)
ef
```

```
## Call:
## efficient.frontier(er = mu.vec, cov.mat = sigma2.mat, nport = 20, 
##     alpha.min = -0.5, alpha.max = 2)
## 
## Frontier portfolios' expected returns and standard deviations
##    port 1 port 2 port 3 port 4 port 5 port 6 port 7 port 8 port 9
## ER 0.2229 0.2103 0.1977 0.1851 0.1725 0.1599 0.1473 0.1347 0.1221
## SD 0.3712 0.3410 0.3111 0.2814 0.2522 0.2236 0.1958 0.1693 0.1448
##    port 10 port 11 port 12 port 13 port 14 port 15 port 16 port 17
## ER  0.1095  0.0969  0.0843  0.0717  0.0591  0.0465  0.0339  0.0213
## SD  0.1235  0.1073  0.0986  0.0996  0.1100  0.1274  0.1495  0.1745
##    port 18 port 19 port 20
## ER  0.0087 -0.0039 -0.0165
## SD  0.2013  0.2292  0.2580
```

- ER: expected return
- SD: standard deviation
- `alpha.min` and `alpha.max` specify the range of portfolio weights on
  individual assets.

## Plotting the efficient frontier

Interactively, `plot(ef, plot.assets = TRUE)` draws the frontier together with
the individual assets. That shortcut cannot be used inside a rendered document:
it re-evaluates the symbols stored in `ef$call`, which are looked up in the
global environment rather than in the rendering environment. Drawing the same
picture directly avoids the problem, and lets us add the global minimum
variance portfolio, the tangency portfolio and the capital allocation line.


``` r
plot(ef$sd, ef$er, type = "b", col = "blue", pch = 16,
     xlim = range(c(0, sigma.vec, ef$sd)),
     ylim = range(c(0, mu.vec, ef$er)),
     xlab = "Portfolio SD", ylab = "Portfolio ER", main = "Efficient Frontier")
text(sigma.vec, mu.vec, labels = names(mu.vec))

# global min variance ptf
points(gmv.port$sd, gmv.port$er, col="green", pch=16, cex=2)
text(gmv.port$sd, gmv.port$er, labels = "Global min", pos = 4)

# tangency ptf
points(tan.port$sd, tan.port$er, col="red", pch=16, cex=2)
text(tan.port$sd, tan.port$er, labels = "Tangency", pos = 3)

# Capital Allocation Line
sr.tan = (tan.port$er - rf)/tan.port$sd
abline(a=rf, b=sr.tan, col="green", lwd=2)
```

# Practical Exercise: Boeing and Microsoft

## Data and parameters {-}

Annual estimates of stock return parameters

|                             | Boeing | Microsoft |
| :-------------------------: | :----: | :-------: |
|           `\(\mu\)`           | 0.149  |   0.331   |
|       `\(\sigma^{2}\)`        | 0.069  |   0.136   |
| `\(\rho\)`(Boeing, Microsoft) | -0.008 |           |

Risk free rate (annual) `\(r_f = 0.03\)`.


``` r
# Given parameters
mu.vec &lt;- c(0.149, 0.331)               # mu_A, mu_B
names(mu.vec) &lt;- c("Boeing", "Microsoft")

var &lt;- c(0.069, 0.136)              # variances
sigma &lt;- sqrt(var)                  # standard deviations
names(sigma) &lt;- c("Boeing", "Microsoft")

rho_AB &lt;- -0.008
cov_AB  &lt;- rho_AB * sigma[1] * sigma[2]

# covariance matrix
sigma2.mat &lt;- matrix(
    c(var[1], cov_AB,
      cov_AB, var[2]),
    nrow = 2, byrow = TRUE)
colnames(sigma2.mat) &lt;- rownames(sigma2.mat) &lt;- c("Boeing", "Microsoft")

rf &lt;- 0.03
```


## Create portfolios and plot `\(E(r_p)\)` vs `\(\mathrm{SD}(r_p)\)`

We create three sets of portfolios

- Boeing and Microsoft with `\(x_{boeing} = -1, -0.9,\ldots, 2\)` and `\(x_{msft} = 1 - x_{boeing}\)`.

- Boeing and T-bills with `\(x_{boeing} = 0, 0.1, \ldots, 2\)` and `\(x_{tbill} = 1 - x_{boeing}\)`.

- Microsoft and T-bills with `\(x_{msft} = 0, 0.1, \ldots, 2\)` and `\(x_{tbill} = 1 - x_{msft}\)`.

We compute portfolio expected return, variance and standard deviation for each portfolio.



``` r
# Helper function for portfolio stats
port_stats_two_assets &lt;- function(
  w_a, mu_a, mu_b,
  sigma_a, sigma_b, cov_ab) {
    w_b &lt;- 1 - w_a
    mu_p &lt;- w_a * mu_a + w_b * mu_b
    var_p &lt;- w_a^2 * sigma_a^2 + w_b^2 * sigma_b^2 + 2 * w_a * w_b * cov_ab
    sd_p &lt;- sqrt(var_p)
    tibble(w_a = w_a, w_b = w_b, mu_p = mu_p, var_p = var_p, sd_p = sd_p)
}

# Boeing vs Microsoft
wA_seq &lt;- seq(-1, 2, by = 0.1)
bm_df &lt;- port_stats_two_assets(
    wA_seq,
    mu_a = mu.vec["Boeing"], mu_b = mu.vec["Microsoft"],
    sigma_a = sigma["Boeing"], sigma_b = sigma["Microsoft"],
    cov_ab = cov_AB
) %&gt;%
    mutate(portfolio = "Boeing-Microsoft")

cat("Boeing-Microsoft portfolios:\n\n")
bm_df %&gt;%
    as.data.table() %&gt;%
    print(topn = 4)
```

### Plot the mean-standard deviation frontier {-}


``` r
# combine and prepare for plotting
all_df &lt;- bind_rows(bm_df, bt_df, mt_df)

# Plot frontier
ggplot(all_df, aes(x = sd_p, y = mu_p, color = portfolio)) +
    geom_line() +
    geom_point(size = 1) +
    labs(
        x = TeX("SD($r_p$)"), y = TeX("E($r_p$)"),
        title = "Mean-Standard Deviation Frontier"
    ) +
    scale_color_manual(values = c("Boeing-Microsoft" = "#EE0000FF", "Boeing-Tbill" = "#3B4992FF", "Microsoft-Tbill" = "#008B45FF")) +
    theme_minimal() +
    theme(legend.position = "bottom")
```

## Tangency Portfolio
