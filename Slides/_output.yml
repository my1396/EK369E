# Shared output options for every deck in Slides/.
#
# rmarkdown deep-merges this with each .Rmd's own YAML, key by key: anything a
# deck declares in its own `output:` block wins, anything it omits comes from
# here. Note that lists replace rather than append -- a deck declaring its own
# `css:` loses this one entirely, so it must repeat the shared entries.
#
# Author and date live in _meta.yml (metadata cannot go in _output.yml), which
# is why each deck's header is only a `title:` line.

xaringan::moon_reader:
  css: ["theme/xaringan-themer.css", "theme/custom.css"]
  lib_dir: libs
  nature:
    ratio: '16:9'
    slideNumberFormat: '%current%/%total%'
    countIncrementalSlides: false
    highlightStyle: github
    highlightLines: true
    highlightSpans: true
  includes:
    in_header: ["libs/mathjax.html", "libs/in_header.html"]
    after_body: ["theme/example-numbering.html", "libs/after_body.html"]
  pandoc_args: ["--metadata-file=_meta.yml"]
